name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build and publish assets for (e.g. v2.30.0). Defaults to latest tag if release-please did not create one.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please (v4)
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build-and-publish:
    name: Build & Publish Release Assets
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Disable conflicting GNU link
        run: |
          if (Test-Path "C:\Program Files\Git\usr\bin\link.exe") {
              Rename-Item -Path "C:\Program Files\Git\usr\bin\link.exe" -NewName "link.exe.bak"
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.103

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Inno Setup
        run: |
          $innoUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe"
          $innoInstaller = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $innoUrl -OutFile $innoInstaller
          if (-not (Test-Path $innoInstaller) -or (Get-Item $innoInstaller).Length -lt 1000000) {
              throw "Failed to download Inno Setup installer from $innoUrl"
          }
          Start-Process -FilePath $innoInstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              throw "ISCC.exe not found at $iscc after installation"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC_PATH=$iscc"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $iscc)

      - name: Run Tests
        run: dotnet test ${{ github.workspace }}\src -c Release

      - name: Build, publish and package
        run: python ${{ github.workspace }}\Build\Release.py SelfContained

      - name: Upload Release Assets via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag_name }}"
          if (-not $tag) {
              $tag = "${{ needs.release-please.outputs.tag_name }}"
          }
          if (-not $tag) {
              git fetch --tags origin 2>$null
              $tag = (git describe --tags --abbrev=0 2>$null)
          }
          if (-not $tag) {
              $xml = [xml](Get-Content src/GIMI-ModManager.WinUI/GIMI-ModManager.WinUI.csproj)
              $ver = $xml.Project.PropertyGroup.VersionPrefix | Where-Object { $_ }
              if ($ver) {
                  $tag = "v$ver"
              }
          }
          if (-not $tag) {
              Write-Error "Unable to determine release tag!"
              exit 1
          }
          Write-Host "Uploading release assets for tag $tag..."
          $assets = @()
          $zip = Get-Item JASM_*.7z -ErrorAction SilentlyContinue
          if ($zip) { $assets += $zip.FullName }
          $setup = Get-Item JASM_*_Setup.exe -ErrorAction SilentlyContinue
          if ($setup) { $assets += $setup.FullName }
          
          if ($assets.Count -gt 0) {
              gh release upload $tag $assets --clobber
          } else {
              Write-Error "No release artifacts found to upload!"
              exit 1
          }
